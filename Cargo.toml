[workspace]
resolver = "2"
members = [
    "crates/apex-ai",
    "crates/apex-core",
    "crates/apex-dap",
    "crates/apex-git",
    "crates/apex-lsp",
    "crates/apex-settings",
    "crates/apex-syntax",
    "crates/apex-term",
    "crates/apex-ui",
    "crates/apex-cli",
]

[workspace.package]
version = "1.0.5"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
glyphon = "0.12"
pollster = "1.0"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
wgpu = "30.0"
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
